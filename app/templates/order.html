{% extends "base.html" %}
{% block title %}Order — Digital Hub{% endblock %}
{% block content %}
<section class="form-wrap">
  <p class="eyebrow">START A PROJECT</p><h1>Request a digital service</h1>
  <p>Tell us what you need. We'll contact you with the price and next step.</p>
  <form method="post" class="form">
    <label>Your name<input name="customer_name" required></label>
    <label>Phone / WhatsApp / Email<input name="contact" required></label>
    <label>Service<select name="service" required>
      {% for s in services %}<option>{{ s.name }}</option>{% endfor %}
    </select></label>
    <label>What do you need?<textarea name="message" rows="6" placeholder="Describe the job, deadline, size, style, etc."></textarea></label>
    <button class="button">Send request</button>
  </form>
</section>
{% endblock %}
